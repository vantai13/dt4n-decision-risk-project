[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "ndtrisk"
version = "0.1.0"
description = "Decision-level trustworthiness of Network Digital Twins under stale telemetry"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "pandas>=2.1",
  "pyarrow>=14",
  "matplotlib>=3.8",
  "networkx>=3.2",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["ndtrisk*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
